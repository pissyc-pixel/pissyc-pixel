  <title id="title">DIVA 工作流程</title>
  <desc id="desc">输入活动需求，匹配 Skill 与案例，生成主视觉，经设计师确认后批量生成多尺寸素材。</desc>
  <rect width="1120" height="206" rx="14" fill="#202a24"/>
