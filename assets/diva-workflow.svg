  <path d="M30 52h1060" stroke="#455141"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="30" y="89" fill="#b7d38e" font-size="13">01</text>
    <text x="30" y="120" fill="#f4f5ef" font-size="23" font-weight="500">Campaign brief</text>
